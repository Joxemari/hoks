<title>La tanda</title>

<style>
  /* hrrs — el circuito en vivo, y elegir dos de cada tanda.
     Un solo tema, y a propósito: se juzga tinta negra sobre papel blanco. Sistema de la
     casa: Courier New, papel #fff, tinta #111. */
  :root {
    --papel: #ffffff;
    --tinta: #111111;
    --gris:  #77736c;
    --linea: #ded9d1;
    --hueco: #f6f4f0;
    --marca: #b8352a;
    --mono: "Courier New", Courier, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--papel); color: var(--tinta);
    font-family: var(--mono); font-size: 13px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .app { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }

  header {
    display: flex; align-items: stretch; border-bottom: 1px solid var(--linea);
    flex-wrap: wrap; position: sticky; top: 0; background: var(--papel); z-index: 2;
  }
  .tit { padding: 10px 18px; border-right: 1px solid var(--linea); display: flex;
         flex-direction: column; justify-content: center; }
  .tit b { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 11px; }
  .tit span { color: var(--gris); font-size: 11px; }
  .mandos { display: flex; align-items: center; gap: 14px; padding: 8px 16px; flex: 1;
            flex-wrap: wrap; }
  .btn {
    appearance: none; font-family: var(--mono); font-size: 12px;
    background: var(--papel); color: var(--tinta);
    border: 1px solid var(--tinta); padding: 7px 12px; cursor: pointer;
    transition: background .12s, color .12s;
  }
  .btn:hover { background: var(--tinta); color: var(--papel); }
  .btn.suave { border-color: var(--linea); color: var(--gris); }
  .btn.suave:hover { background: var(--hueco); color: var(--tinta); }
  .btn[aria-pressed="true"] { background: var(--tinta); color: var(--papel); }
  .btn:focus-visible { outline: 2px solid var(--marca); outline-offset: 2px; }
  .sel { margin-left: auto; font-size: 12px; color: var(--gris); font-variant-numeric: tabular-nums; }
  .sel b { color: var(--marca); }

  .rejilla {
    display: grid; gap: 1px; background: var(--linea);
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    border-bottom: 1px solid var(--linea);
  }
  /* La tarjeta ya no es un botón: dentro hay un campo de texto, y un textarea dentro de
     un <button> es HTML inválido y no coge el foco. El botón es sólo el lienzo. */
  .obra { background: var(--papel); position: relative; display: flex; flex-direction: column;
          transition: background .12s; }
  .obra .lienzo {
    appearance: none; background: none; border: 0; padding: 0; margin: 0;
    display: block; width: 100%; cursor: pointer; position: relative;
  }
  .obra canvas { display: block; width: 100%; height: auto; }
  .obra .pie {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 6px 10px 9px; font-size: 11px; color: var(--gris);
    font-variant-numeric: tabular-nums;
  }
  .obra:hover { background: var(--hueco); }
  .obra.elegida { background: #fbeeec; }
  .obra.elegida .pie { color: var(--marca); }
  .obra.elegida .lienzo::after {
    content: ""; position: absolute; inset: 0; border: 2px solid var(--marca); pointer-events: none;
  }
  .obra.connota .num::before { content: "✎ "; color: var(--marca); }
  .obra .lienzo:focus-visible { outline: 2px solid var(--marca); outline-offset: -2px; }
  .num { letter-spacing: .1em; }
  .notabtn {
    appearance: none; background: none; border: 1px solid var(--linea);
    font-family: var(--mono); font-size: 10px; color: var(--gris);
    padding: 2px 7px; cursor: pointer; letter-spacing: .06em;
  }
  .notabtn:hover { background: var(--papel); color: var(--tinta); border-color: var(--tinta); }
  .notabtn:focus-visible { outline: 2px solid var(--marca); outline-offset: 1px; }
  .nota {
    margin: 0 10px 10px; font-family: var(--mono); font-size: 11px; line-height: 1.45;
    color: var(--tinta); background: var(--papel);
    border: 1px solid var(--linea); padding: 7px 8px; resize: vertical;
  }
  .nota::placeholder { color: #a8a49c; }
  .nota:focus { outline: 0; border-color: var(--marca); }
  .nota[hidden] { display: none; }

  footer {
    padding: 10px 16px; font-size: 11px; color: var(--gris);
    display: flex; gap: 18px; flex-wrap: wrap; align-items: center;
  }
  footer kbd { font-family: var(--mono); border: 1px solid var(--linea); padding: 1px 5px;
               color: var(--tinta); background: var(--papel); }
  #aviso { margin-left: auto; color: var(--marca); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header>
    <div class="tit">
      <b>hrrs · la tanda</b>
      <span>elige dos · y di qué falla</span>
    </div>
    <div class="mandos">
      <button class="btn" id="nueva">Nueva tanda</button>
      <button class="btn suave" id="vista" aria-pressed="false">Ver el circuito</button>
      <label class="sel" style="margin-left:0;display:flex;gap:7px;align-items:center">
        <span>por tanda</span>
        <select id="cuantas" style="font-family:var(--mono);font-size:12px;padding:4px 6px;border:1px solid var(--linea);background:var(--papel);color:var(--tinta)">
          <option>5</option><option selected>10</option>
        </select>
      </label>
      <button class="btn suave" id="copiar">Copiar elegidas y notas</button>
      <button class="btn suave" id="vaciar">Vaciar</button>
      <span class="sel">en esta tanda <b id="ncur">0</b> · guardadas <b id="ntot">0</b>
        · notas <b id="nnotas">0</b></span>
    </div>
  </header>

  <div class="rejilla" id="rejilla"></div>

  <footer>
    <span><kbd>clic</kbd> elegir</span>
    <span><kbd>N</kbd> nueva tanda</span>
    <span><kbd>C</kbd> circuito / tinta</span>
    <span>la nota se guarda sola</span>
    <span id="aviso"></span>
  </footer>
</div>

<script>
// hrrs — EL CIRCUITO, en el orden que dicta el autor a mano:
//
//   1. DIBUJAR PRIMER TRAZO ......... y el dibujo son PUNTOS SUELTOS
//   2. UNIR PUNTOS
//   3. DIBUJAR OTROS TRAZOS, TAMBIÉN PARTIENDO DE SUS PUNTOS
//        · PARALELIZAR / SOLAPE
//        · ATRAER ↑↑
//   4. DAR CUERPO
//   5. REVISAR MÁRGENES
//
// Y el orden es el hallazgo, no un detalle de implementación. El generador anterior
// CAMINABA: paso a paso, comprobando en cada tramo si cabía, y girando cuando no. Por eso
// un trazo que entraba en un callejón moría ahí —nunca retrocede— y el largo se quedaba
// en 0,35 contra los 0,64 de las referencias, arrastrando a la línea (3,28 contra 5,21).
//
// Sembrando los puntos ANTES y uniéndolos después no hay callejón que valga: la longitud
// la ponen los puntos, no lo lejos que se consiga caminar.
//
// Y la ATRACCIÓN es el mecanismo que faltaba para el punto 5 del encargo —«cada punto del
// trazo lleva un valor y si tiende a solaparse»—: el valor no se evalúa andando, se aplica
// AL PUNTO cuando se coloca. Fuerte, cae encima; media, cae al canal; débil, se queda.
'use strict';

function Rng(s) { this.s = (s >>> 0) || 1; }
Rng.prototype.u = function () {
  this.s = (Math.imul(1664525, this.s) + 1013904223) >>> 0;
  return this.s / 4294967296;
};
Rng.prototype.range = function (a, b) { return a + (b - a) * this.u(); };
Rng.prototype.int = function (a, b) { return a + Math.floor(this.u() * (b - a + 1)); };
Rng.prototype.bool = function (p) { return this.u() < p; };
Rng.prototype.pick = function (v) { return v[Math.floor(this.u() * v.length)]; };

const RAD = Math.PI / 180;
const hy = (a, b) => Math.hypot(a, b);

function segCorta(a, b, c, d) {
  const o = (p, q, r) => (q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]);
  return ((o(a, b, c) > 0) !== (o(a, b, d) > 0)) && ((o(c, d, a) > 0) !== (o(c, d, b) > 0));
}
function distSeg(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy;
  let t = l2 > 1e-18 ? ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return hy(p[0] - (a[0] + dx * t), p[1] - (a[1] + dy * t));
}
function segSeg(a, b, c, d) {
  if (segCorta(a, b, c, d)) return 0;
  return Math.min(distSeg(a, c, d), distSeg(b, c, d), distSeg(c, a, b), distSeg(d, a, b));
}
// el punto más cercano de un trazo, con su tangente: lo que hace falta para atraer
function masCerca(p, trazos) {
  let dm = Infinity, r = null;
  for (const t of trazos)
    for (let i = 0; i < t.length - 1; i++) {
      const ax = t[i][0], ay = t[i][1];
      const ex = t[i + 1][0] - ax, ey = t[i + 1][1] - ay, l2 = ex * ex + ey * ey;
      let u = l2 > 1e-18 ? ((p[0] - ax) * ex + (p[1] - ay) * ey) / l2 : 0;
      u = u < 0 ? 0 : u > 1 ? 1 : u;
      const qx = ax + ex * u, qy = ay + ey * u, d = hy(p[0] - qx, p[1] - qy);
      if (d < dm) { dm = d; r = { d, qx, qy, dir: Math.atan2(ey, ex) / RAD }; }
    }
  return r;
}

function circuito(seed) {
  const rng = new Rng(seed);

  const prop = rng.range(1.02, 1.55), apais = rng.bool(0.5);
  const fw = apais ? prop : 1, fh = apais ? 1 : prop;

  // el alfabeto de rumbos: dos anclados al pliego -media longitud va sobre los ejes en
  // las referencias- y dos o cuatro oblicuos, con su error
  const gira = rng.range(-4, 4);
  const rumbos = [gira, gira + 90], pesoRumbo = [0.26, 0.26];
  const nObl = rng.int(2, 4);
  for (let i = 0; i < nObl; i++) {
    rumbos.push(gira + rng.range(20, 70) * (rng.bool(0.5) ? 1 : -1));
    pesoRumbo.push(0.48 / nObl);
  }
  const todos = [];
  for (const r of rumbos) { todos.push(r); todos.push(r + 180); }

  const polo = [rng.range(0.32, 0.68) * fw, rng.range(0.32, 0.68) * fh];

  // LA BANDA FINA PESA MÁS. No es un invariante de las seis —van de 0,025 a 0,096— es una
  // preferencia del autor, medida: de 24 obras que eligió sin ponerles ni una queja, la
  // anchura sale 0,05 contra 0,06 de la población (z = −0,79). Se anota como lo que es.
  const W = rng.range(0.028, 0.075);

  const TIPOS = {
    denso:   { n: [8, 14], sepK: [1.04, 1.18], atrae: [0.55, 0.85], solape: 0.10 },
    abierto: { n: [5, 8],  sepK: [1.30, 2.20], atrae: [0.22, 0.50], solape: 0.03 },
  };
  const tipo = rng.bool(0.62) ? 'denso' : 'abierto';
  const T = TIPOS[tipo];
  const sep = W * rng.range(T.sepK[0], T.sepK[1]);
  const carril = sep * 1.10;
  const mg = W * 0.5 + 0.004;
  const n = rng.int(T.n[0], T.n[1]);
  const fuerza = rng.range(T.atrae[0], T.atrae[1]);   // cuánto atrae ESTA obra

  const PASO = 0.105;              // entre punto y punto: la cadencia de quiebro
  const ERR_RUMBO = 7;

  const eligeRumbo = (desde) => {
    if (desde == null) {
      let u = rng.u(), acc = 0, k = 0;
      for (; k < rumbos.length; k++) { acc += pesoRumbo[k]; if (u <= acc) break; }
      return rumbos[Math.min(k, rumbos.length - 1)] + (rng.bool(0.5) ? 0 : 180)
             + rng.range(-ERR_RUMBO, ERR_RUMBO);
    }
    const cand = todos.map(r => ({ r, d: Math.abs(((r - desde + 540) % 360) - 180) }))
                      .filter(o => o.d > 12).sort((a, b) => a.d - b.d);
    if (!cand.length) return desde;
    const i = rng.bool(0.72) ? 0 : Math.min(cand.length - 1, rng.int(1, 2));
    return cand[i].r + rng.range(-ERR_RUMBO, ERR_RUMBO);
  };
  const dentro = p => [Math.max(mg, Math.min(fw - mg, p[0])),
                       Math.max(mg, Math.min(fh - mg, p[1]))];

  // ── 1 y 2. SEMBRAR LOS PUNTOS Y UNIRLOS ──────────────────────────────────────
  // Sin comprobar nada: los puntos se ponen y se unen. Lo que estorbe se arregla en el
  // paso 3 y en la reparación, no impidiendo que el trazo exista.
  function siembra(p0, dir0, largo) {
    const pts = [dentro(p0)];
    let dir = dir0, hecho = 0;
    while (hecho < largo) {
      const L = Math.min(PASO * rng.range(0.72, 1.5), largo - hecho);
      const q = pts[pts.length - 1];
      pts.push(dentro([q[0] + Math.cos(dir * RAD) * L, q[1] + Math.sin(dir * RAD) * L]));
      hecho += L;
      dir = eligeRumbo(dir);
    }
    return pts;
  }

  // ── 3. ATRAER: paralelizar, o solapar si la atracción es fuerte ───────────────
  function atrae(pts, trazos) {
    if (!trazos.length) return pts;
    return pts.map((p, i) => {
      const v = masCerca(p, trazos);
      if (!v || v.d > sep * 4.5) return p;              // demasiado lejos: no le llega
      // el valor DE ESTE PUNTO: si tiende a solaparse, cae encima; si no, al canal
      const solapa = rng.bool(T.solape);
      const meta = solapa ? 0 : carril;
      const f = fuerza * (i === 0 || i === pts.length - 1 ? 0.75 : 1);
      const nx = (p[0] - v.qx) / Math.max(1e-9, v.d), ny = (p[1] - v.qy) / Math.max(1e-9, v.d);
      const d2 = v.d + (meta - v.d) * f;
      return dentro([v.qx + nx * d2, v.qy + ny * d2]);
    });
  }

  // ── la reparación: sin cruces, y sin rendijas ───────────────────────────────────
  // Las referencias no cruzan un solo par de centros en 220 posibles, así que un cruce se
  // repara APARTANDO EL PUNTO, no truncando el trazo: la longitud ya está decidida.
  function repara(pts, trazos) {
    for (let vuelta = 0; vuelta < 5; vuelta++) {
      let mal = false;
      for (let i = 0; i < pts.length - 1; i++) {
        let choca = null;
        for (const t of trazos)
          for (let j = 0; j < t.length - 1; j++) {
            const d = segSeg(pts[i], pts[i + 1], t[j], t[j + 1]);
            if (d < sep) { choca = masCerca(pts[i + 1], [t]); break; }
          }
        if (!choca) continue;
        mal = true;
        // se empuja el vértice hacia fuera hasta el canal
        const nx = (pts[i + 1][0] - choca.qx) / Math.max(1e-9, choca.d);
        const ny = (pts[i + 1][1] - choca.qy) / Math.max(1e-9, choca.d);
        pts[i + 1] = dentro([choca.qx + nx * carril * 1.06, choca.qy + ny * carril * 1.06]);
      }
      if (!mal) break;
    }
    // y si algo sigue cruzando, se recorta ahí: es la última salida, no la primera
    for (let i = 0; i < pts.length - 1; i++)
      for (const t of trazos)
        for (let j = 0; j < t.length - 1; j++)
          if (segCorta(pts[i], pts[i + 1], t[j], t[j + 1])) return pts.slice(0, i + 1);
    return pts;
  }

  const trazos = [];
  const Lmed = rng.range(0.52, 0.86);
  for (let k = 0; k < n; k++) {
    const largo = Lmed * (k === 0 ? rng.range(1.4, 1.8) : rng.range(0.62, 1.25));
    let mejor = null;
    for (let intento = 0; intento < 8 && !mejor; intento++) {
      // de dónde arranca: casi siempre junto al cuerpo ya puesto —dos de cada tres cabos
      // de las referencias mueren contra otro trazo— y si no, con la gravedad del polo
      let p0, dir0;
      if (trazos.length && rng.bool(0.72)) {
        const padre = rng.bool(0.66) ? trazos[trazos.length - 1] : rng.pick(trazos);
        const i = rng.int(0, padre.length - 2), f = rng.u();
        const q = [padre[i][0] + (padre[i + 1][0] - padre[i][0]) * f,
                   padre[i][1] + (padre[i + 1][1] - padre[i][1]) * f];
        const pd = Math.atan2(padre[i + 1][1] - padre[i][1], padre[i + 1][0] - padre[i][0]);
        const lado = rng.bool(0.5) ? 1 : -1;
        p0 = [q[0] + Math.cos(pd + Math.PI / 2 * lado) * carril,
              q[1] + Math.sin(pd + Math.PI / 2 * lado) * carril];
        dir0 = pd / RAD + (rng.bool(0.5) ? 0 : 180);
      } else {
        const a = rng.range(0, 6.2832), r = rng.range(0, 0.34);
        p0 = [polo[0] + Math.cos(a) * r * fw, polo[1] + Math.sin(a) * r * fh];
        dir0 = eligeRumbo(null);
      }
      let pts = siembra(p0, dir0, largo);
      pts = atrae(pts, trazos);
      pts = repara(pts, trazos);
      let L = 0;
      for (let i = 0; i < pts.length - 1; i++) L += hy(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
      if (pts.length >= 2 && L > 0.18) mejor = pts;
    }
    if (mejor) trazos.push(mejor);
  }
  return { trazos, fw, fh, W, sep, polo, rumbos, tipo, fuerza, seed };
}




// ── VESTIR EL CIRCUITO ────────────────────────────────────────────────────────
// Ahora que los centros no se cruzan, la técnica cabe en diez líneas: por cada trazo,
// primero su FOSO —un trazo blanco de W+2g— y encima su tinta de W. El foso del que
// llega después muerde al que ya estaba, así que entre dos bandas queda exactamente g y
// el reparto sale ASIMÉTRICO solo. Es el paso 4 del autor —«se rellena hasta el
// margen»— hecho por orden de pintado en vez de por aritmética de esquinas.
function vestir(cx, W, H, circuito, soloEje) {
  const S = Math.min(W, H);
  const esc = S / Math.min(circuito.fw, circuito.fh);
  const ox = (W - circuito.fw * esc) / 2, oy = (H - circuito.fh * esc) / 2;
  cx.save();
  cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, W, H);
  cx.translate(ox, oy); cx.scale(esc, esc);
  const traza = (p) => {
    cx.beginPath(); cx.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length; i++) cx.lineTo(p[i][0], p[i][1]);
  };
  if (soloEje) {
    cx.lineWidth = 0.006; cx.lineJoin = 'round'; cx.lineCap = 'round';
    cx.strokeStyle = '#111111';
    for (const p of circuito.trazos) { traza(p); cx.stroke(); }
    // los cabos, marcados: es donde se ve si el trazo muere contra el cuerpo o al aire
    cx.fillStyle = '#b8352a';
    for (const p of circuito.trazos) for (const q of [p[0], p[p.length - 1]]) {
      cx.beginPath(); cx.arc(q[0], q[1], 0.010, 0, 6.2832); cx.fill();
    }
  } else {
    const g = circuito.W * 0.22;                 // el margen medido: 0,22 anchuras
    const Wp = circuito.W * 1.35;                // el relleno, hasta el margen
    cx.lineJoin = 'round'; cx.lineCap = 'butt';  // el remate es a escuadra
    for (const p of circuito.trazos) {
      cx.strokeStyle = '#ffffff'; cx.lineWidth = Wp + 2 * g; traza(p); cx.stroke();
      cx.strokeStyle = '#111111'; cx.lineWidth = Wp;         traza(p); cx.stroke();
    }
  }
  cx.restore();
}

// ── estado ────────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const LS = 'hrrs-tanda-v2';
// `apuntes` va por SEMILLA y no por posición en la tanda: una nota sobrevive a la
// tanda en que se escribió, y una obra que vuelve a salir trae lo que ya dijiste.
const est = { obras: [], eje: false, apuntes: {} };

try {
  const g = JSON.parse(localStorage.getItem(LS) || '{}');
  if (g && typeof g.apuntes === 'object' && g.apuntes) est.apuntes = g.apuntes;
} catch (e) { /* primera vez */ }
function guarda() {
  try { localStorage.setItem(LS, JSON.stringify({ apuntes: est.apuntes })); } catch (e) {}
}
const ap = (s) => (est.apuntes[s] = est.apuntes[s] || { elegida: false, nota: '' });
const elegidas = () => Object.keys(est.apuntes).filter(s => est.apuntes[s].elegida);
const conNota = () => Object.keys(est.apuntes).filter(s => (est.apuntes[s].nota || '').trim());

function marcador() {
  $('ncur').textContent = est.obras.filter(o => ap(o.seed).elegida).length;
  $('ntot').textContent = elegidas().length;
  $('nnotas').textContent = conNota().length;
}

// ── la tanda ──────────────────────────────────────────────────────────────────
function nuevaTanda() {
  const n = parseInt($('cuantas').value, 10);
  est.obras = [];
  for (let i = 0; i < n; i++) {
    const s = (Math.floor(Math.random() * 0xffffffff) >>> 0) || 1;
    est.obras.push({ seed: s, c: circuito(s) });
  }
  construye();
}

// SE CONSTRUYE UNA VEZ POR TANDA Y LUEGO SE TOCA EN SITIO. Reconstruyendo la rejilla en
// cada clic —que es lo que hacía— se perdía lo escrito en el campo de notas y el foco
// se iba al cuerpo del documento a media frase.
function construye() {
  const r = $('rejilla'); r.innerHTML = '';
  for (const o of est.obras) {
    const a = ap(o.seed);
    const card = document.createElement('div');
    card.className = 'obra';
    card.dataset.seed = o.seed;

    const bt = document.createElement('button');
    bt.className = 'lienzo';
    bt.setAttribute('aria-pressed', a.elegida ? 'true' : 'false');
    bt.setAttribute('aria-label', 'Elegir la obra ' + o.seed.toString(16));
    const cv = document.createElement('canvas');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = 460, h = Math.round(460 * (o.c.fh / o.c.fw));
    cv.width = w * dpr; cv.height = h * dpr;
    cv.style.aspectRatio = w + ' / ' + h;
    cv.getContext('2d').scale(dpr, dpr);
    bt.appendChild(cv); card.appendChild(bt);

    const pie = document.createElement('div');
    pie.className = 'pie';
    const izq = document.createElement('span');
    izq.className = 'num'; izq.textContent = '#' + o.seed.toString(16);
    const der = document.createElement('span');
    der.textContent = o.c.trazos.length + ' trazos';
    const bn = document.createElement('button');
    bn.className = 'notabtn'; bn.type = 'button';
    bn.textContent = a.nota ? '✎ nota' : '+ nota';
    pie.appendChild(izq); pie.appendChild(bn); pie.appendChild(der);
    card.appendChild(pie);

    const ta = document.createElement('textarea');
    ta.className = 'nota'; ta.value = a.nota || '';
    ta.rows = 3;
    ta.placeholder = 'Qué falla, aunque la elijas. Concreto: «el trazo de arriba se queda solo».';
    ta.hidden = !a.nota;
    ta.oninput = () => {
      a.nota = ta.value; guarda();
      bn.textContent = ta.value.trim() ? '✎ nota' : '+ nota';
      card.classList.toggle('connota', !!ta.value.trim());
      marcador();
    };
    card.appendChild(ta);

    card.classList.toggle('elegida', !!a.elegida);
    card.classList.toggle('connota', !!(a.nota || '').trim());

    bt.onclick = () => {
      const yo = ap(o.seed);
      if (yo.elegida) yo.elegida = false;
      else if (est.obras.filter(x => ap(x.seed).elegida).length >= 2) {
        avisa('Dos por tanda: quita una primero'); return;
      } else {
        yo.elegida = true;
        // al elegir, se abre la nota: lo que falla en la buena es lo que más enseña
        ta.hidden = false; ta.focus();
      }
      bt.setAttribute('aria-pressed', yo.elegida ? 'true' : 'false');
      card.classList.toggle('elegida', yo.elegida);
      guarda(); marcador();
    };
    bn.onclick = () => { ta.hidden = !ta.hidden; if (!ta.hidden) ta.focus(); };

    r.appendChild(card);
    o.cv = cv;
  }
  redibuja(); marcador();
}

function redibuja() {
  for (const o of est.obras) {
    if (!o.cv) continue;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    vestir(o.cv.getContext('2d'), o.cv.width / dpr, o.cv.height / dpr, o.c, est.eje);
  }
}

function avisa(t) {
  const a = $('aviso'); a.textContent = t;
  clearTimeout(avisa._t); avisa._t = setTimeout(() => { a.textContent = ''; }, 2600);
}

// ── mandos ────────────────────────────────────────────────────────────────────
$('nueva').onclick = nuevaTanda;
$('cuantas').onchange = nuevaTanda;
$('vista').onclick = () => {
  est.eje = !est.eje;
  $('vista').setAttribute('aria-pressed', est.eje ? 'true' : 'false');
  $('vista').textContent = est.eje ? 'Ver la tinta' : 'Ver el circuito';
  redibuja();
};
$('copiar').onclick = async () => {
  const claves = Array.from(new Set(elegidas().concat(conNota())));
  if (!claves.length) { avisa('Todavía no hay nada elegido ni apuntado'); return; }
  const out = claves.map(s => ({
    semilla: Number(s), elegida: !!est.apuntes[s].elegida,
    nota: (est.apuntes[s].nota || '').trim() || null
  }));
  const txt = JSON.stringify(out);
  try {
    await navigator.clipboard.writeText(txt);
    avisa('Copiadas ' + out.length + ' · ' + out.filter(o => o.elegida).length + ' elegidas');
  } catch (e) {
    const t2 = document.createElement('textarea');
    t2.value = txt;
    t2.style.cssText = 'position:fixed;top:8%;left:8%;width:84%;height:70%;z-index:9;font-family:var(--mono);font-size:11px';
    document.body.appendChild(t2); t2.select();
    avisa('Selecciona y copia a mano, luego Esc');
    t2.addEventListener('keydown', ev => { if (ev.key === 'Escape') t2.remove(); });
  }
};
$('vaciar').onclick = () => {
  if (!elegidas().length && !conNota().length) return;
  est.apuntes = {}; guarda(); construye();
  avisa('Borrado todo lo guardado');
};
addEventListener('keydown', e => {
  const t = e.target.tagName;
  if (t === 'SELECT' || t === 'TEXTAREA' || t === 'INPUT') return;
  if (e.key.toLowerCase() === 'n') nuevaTanda();
  if (e.key.toLowerCase() === 'c') $('vista').click();
});
nuevaTanda();
</script>
