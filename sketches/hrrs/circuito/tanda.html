<title>La tanda</title>

<style>
  /* hrrs — el circuito en vivo, y elegir dos de cada tanda.
     Un solo tema, y a propósito: se juzga tinta negra sobre papel blanco. Sistema de la
     casa: Courier New, papel #fff, tinta #111. */
  :root {
    --papel: #ffffff;
    --tinta: #111111;
    --gris:  #77736c;
    --linea: #ded9d1;
    --hueco: #f6f4f0;
    --marca: #b8352a;
    --mono: "Courier New", Courier, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--papel); color: var(--tinta);
    font-family: var(--mono); font-size: 13px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .app { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }

  header {
    display: flex; align-items: stretch; border-bottom: 1px solid var(--linea);
    flex-wrap: wrap; position: sticky; top: 0; background: var(--papel); z-index: 2;
  }
  .tit { padding: 10px 18px; border-right: 1px solid var(--linea); display: flex;
         flex-direction: column; justify-content: center; }
  .tit b { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 11px; }
  .tit span { color: var(--gris); font-size: 11px; }
  .mandos { display: flex; align-items: center; gap: 14px; padding: 8px 16px; flex: 1;
            flex-wrap: wrap; }
  .btn {
    appearance: none; font-family: var(--mono); font-size: 12px;
    background: var(--papel); color: var(--tinta);
    border: 1px solid var(--tinta); padding: 7px 12px; cursor: pointer;
    transition: background .12s, color .12s;
  }
  .btn:hover { background: var(--tinta); color: var(--papel); }
  .btn.suave { border-color: var(--linea); color: var(--gris); }
  .btn.suave:hover { background: var(--hueco); color: var(--tinta); }
  .btn[aria-pressed="true"] { background: var(--tinta); color: var(--papel); }
  .btn:focus-visible { outline: 2px solid var(--marca); outline-offset: 2px; }
  .sel { margin-left: auto; font-size: 12px; color: var(--gris); font-variant-numeric: tabular-nums; }
  .sel b { color: var(--marca); }

  .rejilla {
    display: grid; gap: 1px; background: var(--linea);
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    border-bottom: 1px solid var(--linea);
  }
  .obra {
    background: var(--papel); position: relative; padding: 0;
    border: 0; cursor: pointer; font-family: var(--mono); display: block; width: 100%;
    transition: background .12s;
  }
  .obra canvas { display: block; width: 100%; height: auto; }
  .obra .pie {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px 9px; font-size: 11px; color: var(--gris);
    font-variant-numeric: tabular-nums;
  }
  .obra:hover { background: var(--hueco); }
  .obra[aria-pressed="true"] { background: #fbeeec; }
  .obra[aria-pressed="true"] .pie { color: var(--marca); }
  .obra[aria-pressed="true"]::after {
    content: ""; position: absolute; inset: 0; border: 2px solid var(--marca); pointer-events: none;
  }
  .obra:focus-visible { outline: 2px solid var(--marca); outline-offset: -2px; }
  .num { letter-spacing: .1em; }

  footer {
    padding: 10px 16px; font-size: 11px; color: var(--gris);
    display: flex; gap: 18px; flex-wrap: wrap; align-items: center;
  }
  footer kbd { font-family: var(--mono); border: 1px solid var(--linea); padding: 1px 5px;
               color: var(--tinta); background: var(--papel); }
  #aviso { margin-left: auto; color: var(--marca); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header>
    <div class="tit">
      <b>hrrs · la tanda</b>
      <span>el circuito en vivo · elige dos</span>
    </div>
    <div class="mandos">
      <button class="btn" id="nueva">Nueva tanda</button>
      <button class="btn suave" id="vista" aria-pressed="false">Ver el circuito</button>
      <label class="sel" style="margin-left:0;display:flex;gap:7px;align-items:center">
        <span>por tanda</span>
        <select id="cuantas" style="font-family:var(--mono);font-size:12px;padding:4px 6px;border:1px solid var(--linea);background:var(--papel);color:var(--tinta)">
          <option>5</option><option selected>10</option>
        </select>
      </label>
      <button class="btn suave" id="copiar">Copiar elegidas</button>
      <span class="sel">elegidas <b id="ncur">0</b> · guardadas <b id="ntot">0</b></span>
    </div>
  </header>

  <div class="rejilla" id="rejilla"></div>

  <footer>
    <span><kbd>clic</kbd> elegir</span>
    <span><kbd>N</kbd> nueva tanda</span>
    <span><kbd>C</kbd> circuito / tinta</span>
    <span id="aviso"></span>
  </footer>
</div>

<script>
// hrrs — EL CIRCUITO. Sólo los centros: la línea fina de la que cuelga todo lo demás.
//
// Los invariantes salen de los seis circuitos que el autor marcó a mano, y hay uno que
// manda sobre los demás:
//
//   LOS CENTROS NO SE CRUZAN. Un cruce en 220 pares posibles, en las seis. El motor
//   llevaba nueve vueltas construyendo cruces —`cruceEntero`, `SOLAPE_MIN`, el halo que
//   los separa— y peleando por conseguir paralelas. Prohibido el cruce, las paralelas
//   salen solas: un trazo que no puede atravesar al vecino lo bordea, y bordear a un
//   canal de distancia ES acompañar.
//
//   Y MEDIA LONGITUD VA SOBRE LOS EJES DEL CUADRO (0,52). Chillida ancla el circuito al
//   pliego. El motor sorteaba una diagonal cualquiera y evitaba a propósito alinearse con
//   el papel — decisión contraria a la fuente.
//
// Objetivos medidos (mediana de las seis):
//   n 7,5 · largo 0,64 · reparto 1,56 · línea 5,21 · ejes 0,52 · r1 0,24 · r4 0,60
//   giro 32° · giros por lado 7,55 · cierre 0,30 · cuerda 0,76 · polo 0,41
//   cruces 0 · acompañado 0,32 · cabos al aire 0,32
'use strict';

function Rng(s) { this.s = (s >>> 0) || 1; }
Rng.prototype.u = function () {
  this.s = (Math.imul(1664525, this.s) + 1013904223) >>> 0;
  return this.s / 4294967296;
};
Rng.prototype.range = function (a, b) { return a + (b - a) * this.u(); };
Rng.prototype.int = function (a, b) { return a + Math.floor(this.u() * (b - a + 1)); };
Rng.prototype.bool = function (p) { return this.u() < p; };
Rng.prototype.pick = function (v) { return v[Math.floor(this.u() * v.length)]; };

const RAD = Math.PI / 180;
const hy = (a, b) => Math.hypot(a, b);

function segCorta(a, b, c, d) {
  const o = (p, q, r) => (q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]);
  return ((o(a, b, c) > 0) !== (o(a, b, d) > 0)) && ((o(c, d, a) > 0) !== (o(c, d, b) > 0));
}
function distSeg(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy;
  let t = l2 > 1e-18 ? ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return hy(p[0] - (a[0] + dx * t), p[1] - (a[1] + dy * t));
}
function segSeg(a, b, c, d) {
  if (segCorta(a, b, c, d)) return 0;
  return Math.min(distSeg(a, c, d), distSeg(b, c, d), distSeg(c, a, b), distSeg(d, a, b));
}

function circuito(seed) {
  const rng = new Rng(seed);

  // EL PLIEGO. Las seis van de 1,03 a 1,52; ninguna es cuadrada del todo.
  const prop = rng.range(1.02, 1.55), apais = rng.bool(0.5);
  const fw = apais ? prop : 1, fh = apais ? 1 : prop;

  // EL ALFABETO. Dos rumbos anclados al pliego y uno o dos oblicuos: es lo que da a la
  // vez `ejes 0,52` (la mitad de la longitud en horizontal y vertical) y `r4 0,60`
  // (repartida entre pocas direcciones). El giro del ancla es pequeño a propósito: la
  // obra está alineada con el papel, no girada.
  const gira = rng.range(-4, 4);
  // Con sólo dos anclas y un oblicuo, todo quiebro salía de 90°: medido, giro 90 contra
  // los 32 de las referencias, y toda la longitud en cuatro casillas (r4 = 1,00 contra
  // 0,60). El alfabeto tiene que ser FINO —rumbos cada ~30°— y los ejes pesados: así
  // salen a la vez el giro corto y la mitad de la longitud sobre el pliego.
  const rumbos = [gira, gira + 90], pesoRumbo = [0.26, 0.26];
  const nObl = rng.int(2, 4);
  for (let i = 0; i < nObl; i++) {
    rumbos.push(gira + rng.range(20, 70) * (rng.bool(0.5) ? 1 : -1));
    pesoRumbo.push(0.48 / nObl);
  }

  // EL POLO. El 41 % de la línea cae en un disco de radio 0,25: hay un sitio donde la
  // obra se aprieta, y no es el centro geométrico.
  const polo = [rng.range(0.32, 0.68) * fw, rng.range(0.32, 0.68) * fh];

  const W = rng.range(0.030, 0.092);        // la anchura que tendrá la banda
  const sep = W * rng.range(1.14, 1.34);    // lo que dos centros se respetan
  const mg = W * 0.5 + 0.004;               // margen del pliego

  const n = rng.int(5, 13);
  // LA JERARQUÍA: el más largo mide 1,56 veces el mediano, no diez veces.
  const Lmed = rng.range(0.50, 0.82);
  const largos = [];
  for (let i = 0; i < n; i++) largos.push(Lmed * (i === 0 ? rng.range(1.4, 1.8) : rng.range(0.62, 1.25)));

  // 7,55 quiebros por lado de longitud: un tramo cada 0,13 daba 3,60. La cadencia es
  // del material y se mide, no se elige.
  const PASO = 0.085;
  const ERR_RUMBO = 7;                       // grados de holgura sobre el alfabeto
  const P_QUIEBRO = 0.82;
  const P_ENGANCHA = 0.55;                   // por paso, cuánto tarda en dejarse llevar
  const P_SUELTA = 0.09;                     // por paso, cuánto dura el carril
  const trazos = [];

  // EL QUIEBRO ES CORTO: se va al rumbo de al lado, no al perpendicular. Es lo que da
  // los 32° de las referencias, y es también lo que hace que el trazo parezca uno solo
  // y no una escuadra detrás de otra.
  const todos = [];
  for (const r of rumbos) { todos.push(r); todos.push(r + 180); }
  const eligeRumbo = (desde) => {
    if (desde == null) {
      let u = rng.u(), acc = 0, k = 0;
      for (; k < rumbos.length; k++) { acc += pesoRumbo[k]; if (u <= acc) break; }
      return rumbos[Math.min(k, rumbos.length - 1)] + (rng.bool(0.5) ? 0 : 180)
             + rng.range(-ERR_RUMBO, ERR_RUMBO);
    }
    const cand = todos
      .map(r => ({ r, d: Math.abs(((r - desde + 540) % 360) - 180) }))
      .filter(o => o.d > 12)
      .sort((a, b) => a.d - b.d);
    if (!cand.length) return desde;
    // el de al lado casi siempre; de vez en cuando dos casillas
    const i = rng.bool(0.72) ? 0 : Math.min(cand.length - 1, rng.int(1, 2));
    // con su error: sin el, toda la longitud cae en cuatro casillas de direccion
    // (r4 = 0,98 contra 0,60 de las referencias). El alfabeto se respeta, no se calca.
    return cand[i].r + rng.range(-ERR_RUMBO, ERR_RUMBO);
  };
  // EL CARRIL. `sep` era un SUELO que nadie buscaba: los trazos sólo se acercaban al
  // chocar, y el acompañamiento medía 0,01 contra el 0,32 de las referencias. Un suelo
  // no es una consigna. Aquí el trazo, cuando pasa cerca de otro y va más o menos en su
  // sentido, se ENGANCHA: copia su rumbo local y corrige hacia la distancia `sep`. Sin
  // cruces esto no tiene con qué pelearse — que es lo que lo hace posible.
  const vecinoEn = (p) => {
    let dm = Infinity, dir = 0, qx = 0, qy = 0, hay = false;
    for (const t of trazos)
      for (let i = 0; i < t.length - 1; i++) {
        const d = distSeg(p, t[i], t[i + 1]);
        if (d < dm) {
          dm = d; hay = true;
          dir = Math.atan2(t[i + 1][1] - t[i][1], t[i + 1][0] - t[i][0]) / RAD;
          const ex = t[i + 1][0] - t[i][0], ey = t[i + 1][1] - t[i][1], l2 = ex * ex + ey * ey;
          let u = l2 > 1e-18 ? ((p[0] - t[i][0]) * ex + (p[1] - t[i][1]) * ey) / l2 : 0;
          u = u < 0 ? 0 : u > 1 ? 1 : u;
          qx = t[i][0] + ex * u; qy = t[i][1] + ey * u;
        }
      }
    return hay ? { d: dm, dir, qx, qy } : null;
  };

  // ¿cabe este tramo? Ni cruza a nadie ni se le acerca más que `sep`; y tampoco a sí
  // mismo, que es lo que impide que el trazo se enrolle.
  const cabe = (a, b, mios) => {
    if (a[0] < mg || a[0] > fw - mg || a[1] < mg || a[1] > fh - mg) return false;
    if (b[0] < mg || b[0] > fw - mg || b[1] < mg || b[1] > fh - mg) return false;
    for (const t of trazos)
      for (let i = 0; i < t.length - 1; i++)
        if (segSeg(a, b, t[i], t[i + 1]) < sep) return false;
    for (let i = 0; i < mios.length - 2; i++)
      if (segSeg(a, b, mios[i], mios[i + 1]) < sep * 0.92) return false;
    return true;
  };

  for (let k = 0; k < n; k++) {
    const meta = largos[k];
    let mejor = null;
    for (let intento = 0; intento < 40 && !mejor; intento++) {
      // DÓNDE NACE. Dos de cada tres cabos mueren cerca de otro trazo (0,32 al aire),
      // así que dos de cada tres nacen buscando a alguien: a un canal del cuerpo ya
      // puesto. El resto, con la gravedad del polo.
      let p;
      if (trazos.length && rng.bool(0.66)) {
        const o = rng.pick(trazos);
        const i = rng.int(0, o.length - 2);
        const f = rng.u();
        const q = [o[i][0] + (o[i + 1][0] - o[i][0]) * f, o[i][1] + (o[i + 1][1] - o[i][1]) * f];
        const nrm = Math.atan2(o[i + 1][1] - o[i][1], o[i + 1][0] - o[i][0]) + Math.PI / 2 * (rng.bool(0.5) ? 1 : -1);
        const d = sep * rng.range(1.0, 1.9);
        p = [q[0] + Math.cos(nrm) * d, q[1] + Math.sin(nrm) * d];
      } else {
        const a = rng.range(0, 6.2832), r = rng.range(0, 0.34);
        p = [polo[0] + Math.cos(a) * r * fw, polo[1] + Math.sin(a) * r * fh];
      }
      p = [Math.max(mg, Math.min(fw - mg, p[0])), Math.max(mg, Math.min(fh - mg, p[1]))];

      let dir = eligeRumbo(null);
      const pts = [p];
      let hecho = 0, atasco = 0, enCarril = false;
      while (hecho < meta && atasco < 6) {
        const act = pts[pts.length - 1];
        const v = vecinoEn(act);
        // ¿engancha, sigue, o suelta?
        if (enCarril && (!v || v.d > sep * 3.2 || rng.bool(P_SUELTA))) enCarril = false;
        if (!enCarril && v && v.d < sep * 2.4) {
          let dd = Math.abs(((v.dir - dir + 540) % 360) - 180);
          if (dd > 90) dd = 180 - dd;
          if (dd < 42 && rng.bool(P_ENGANCHA)) enCarril = true;
        }
        if (enCarril && v) {
          // su rumbo, en mi sentido, corregido hacia la consigna `sep`
          let base = v.dir;
          if (Math.abs(((base - dir + 540) % 360) - 180) > 90) base += 180;
          const nx = (act[0] - v.qx) / Math.max(1e-9, v.d), ny = (act[1] - v.qy) / Math.max(1e-9, v.d);
          const cruz = Math.cos(base * RAD) * ny - Math.sin(base * RAD) * nx;
          const err = (v.d - sep) / sep;
          dir = base + Math.max(-32, Math.min(32, err * 46)) * (cruz > 0 ? -1 : 1);
        }
        const L = Math.min(PASO * rng.range(0.7, 1.5), meta - hecho);
        const q = [act[0] + Math.cos(dir * RAD) * L, act[1] + Math.sin(dir * RAD) * L];
        if (cabe(act, q, pts)) {
          pts.push(q); hecho += L; atasco = 0;
          if (!enCarril && rng.bool(P_QUIEBRO)) dir = eligeRumbo(dir);
        } else {
          // BLOQUEADO: no se atraviesa, se BORDEA.
          enCarril = false; dir = eligeRumbo(dir); atasco++;
        }
      }
      // EL CABO MUERE BUSCANDO. Dos de cada tres cabos de las referencias caen junto a
      // otro trazo (0,32 al aire); nacían buscando y morían donde les pillara, y salía
      // 0,70. Si el final quedó al aire y hay alguien a tiro, se recorta hasta el último
      // punto que sí tenía vecino: el trazo acaba CONTRA el cuerpo, que es lo que hace
      // que la hoja se lea como una cosa.
      if (pts.length > 2) {
        const fin = vecinoEn(pts[pts.length - 1]);
        if (!fin || fin.d > sep * 3.5) {
          for (let i = pts.length - 2; i >= 2; i--) {
            const w = vecinoEn(pts[i]);
            if (w && w.d < sep * 2.2) { pts.length = i + 1; break; }
          }
        }
      }
      let Lr = 0;
      for (let i = 0; i < pts.length - 1; i++) Lr += hy(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
      if (pts.length >= 2 && Lr > meta * 0.34 && Lr > 0.16) mejor = pts;
    }
    if (mejor) trazos.push(mejor);
  }
  return { trazos, fw, fh, W, sep, polo, rumbos, seed };
}




// ── VESTIR EL CIRCUITO ────────────────────────────────────────────────────────
// Ahora que los centros no se cruzan, la técnica cabe en diez líneas: por cada trazo,
// primero su FOSO —un trazo blanco de W+2g— y encima su tinta de W. El foso del que
// llega después muerde al que ya estaba, así que entre dos bandas queda exactamente g y
// el reparto sale ASIMÉTRICO solo. Es el paso 4 del autor —«se rellena hasta el
// margen»— hecho por orden de pintado en vez de por aritmética de esquinas.
function vestir(cx, c, W, H, circuito, soloEje) {
  const S = Math.min(W, H);
  const esc = S / Math.min(circuito.fw, circuito.fh);
  const ox = (W - circuito.fw * esc) / 2, oy = (H - circuito.fh * esc) / 2;
  cx.save();
  cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, W, H);
  cx.translate(ox, oy); cx.scale(esc, esc);
  const traza = (p) => {
    cx.beginPath(); cx.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length; i++) cx.lineTo(p[i][0], p[i][1]);
  };
  if (soloEje) {
    cx.lineWidth = 0.006; cx.lineJoin = 'round'; cx.lineCap = 'round';
    cx.strokeStyle = '#111111';
    for (const p of circuito.trazos) { traza(p); cx.stroke(); }
    // los cabos, marcados: es donde se ve si el trazo muere contra el cuerpo o al aire
    cx.fillStyle = '#b8352a';
    for (const p of circuito.trazos) for (const q of [p[0], p[p.length - 1]]) {
      cx.beginPath(); cx.arc(q[0], q[1], 0.010, 0, 6.2832); cx.fill();
    }
  } else {
    const g = circuito.W * 0.22;                 // el margen medido: 0,22 anchuras
    const Wp = circuito.W * 1.35;                // el relleno, hasta el margen
    cx.lineJoin = 'round'; cx.lineCap = 'butt';  // el remate es a escuadra
    for (const p of circuito.trazos) {
      cx.strokeStyle = '#ffffff'; cx.lineWidth = Wp + 2 * g; traza(p); cx.stroke();
      cx.strokeStyle = '#111111'; cx.lineWidth = Wp;         traza(p); cx.stroke();
    }
  }
  cx.restore();
}

// ── la tanda ──────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const est = { semillaTanda: 1, obras: [], elegidas: new Set(), guardadas: [], eje: false };

function nuevaSemilla() {
  return (Math.floor(Math.random() * 0xffffffff) >>> 0) || 1;
}

function nuevaTanda() {
  const n = parseInt($('cuantas').value, 10);
  est.obras = [];
  est.elegidas = new Set();
  for (let i = 0; i < n; i++) {
    const s = nuevaSemilla();
    est.obras.push({ seed: s, c: circuito(s) });
  }
  pinta();
}

function pinta() {
  const r = $('rejilla'); r.innerHTML = '';
  est.obras.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'obra'; b.setAttribute('aria-pressed', est.elegidas.has(i) ? 'true' : 'false');
    const cv = document.createElement('canvas');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = 460, h = Math.round(460 * (o.c.fh / o.c.fw));
    cv.width = w * dpr; cv.height = h * dpr;
    cv.style.aspectRatio = w + ' / ' + h;
    const cx = cv.getContext('2d'); cx.scale(dpr, dpr);
    vestir(cx, cv, w, h, o.c, est.eje);
    b.appendChild(cv);
    const pie = document.createElement('div');
    pie.className = 'pie';
    pie.innerHTML = '<span class="num">#' + o.seed.toString(16) + '</span>' +
                    '<span>' + o.c.trazos.length + ' trazos</span>';
    b.appendChild(pie);
    b.onclick = () => {
      if (est.elegidas.has(i)) est.elegidas.delete(i);
      else if (est.elegidas.size >= 2) avisa('Dos por tanda: quita una primero');
      else est.elegidas.add(i);
      guardaElegidas(); pinta();
    };
    r.appendChild(b);
  });
  $('ncur').textContent = est.elegidas.size;
  $('ntot').textContent = est.guardadas.length;
}

function guardaElegidas() {
  const dela = new Set(est.obras.map(o => o.seed));
  est.guardadas = est.guardadas.filter(s => !dela.has(s));
  for (const i of est.elegidas) est.guardadas.push(est.obras[i].seed);
  try { localStorage.setItem('hrrs-tanda-v1', JSON.stringify(est.guardadas)); } catch (e) {}
}
try {
  const g = JSON.parse(localStorage.getItem('hrrs-tanda-v1') || '[]');
  if (Array.isArray(g)) est.guardadas = g.filter(x => typeof x === 'number');
} catch (e) {}

function avisa(t) {
  const a = $('aviso'); a.textContent = t;
  clearTimeout(avisa._t); avisa._t = setTimeout(() => { a.textContent = ''; }, 2400);
}

$('nueva').onclick = nuevaTanda;
$('cuantas').onchange = nuevaTanda;
$('vista').onclick = () => {
  est.eje = !est.eje;
  $('vista').setAttribute('aria-pressed', est.eje ? 'true' : 'false');
  $('vista').textContent = est.eje ? 'Ver la tinta' : 'Ver el circuito';
  pinta();
};
$('copiar').onclick = async () => {
  if (!est.guardadas.length) { avisa('Todavía no has elegido ninguna'); return; }
  const txt = JSON.stringify({ semillas: est.guardadas });
  try {
    await navigator.clipboard.writeText(txt);
    avisa('Copiadas ' + est.guardadas.length + ' semillas');
  } catch (e) { avisa('No se pudo copiar: ' + txt.slice(0, 60)); }
};
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key.toLowerCase() === 'n') nuevaTanda();
  if (e.key.toLowerCase() === 'c') $('vista').click();
});
nuevaTanda();
</script>
