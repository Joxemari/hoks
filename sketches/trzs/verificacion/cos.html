<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<script src="../../_engine.js"></script>
<script src="./SRC"></script>
<script>
// ============================================================
// COSTURAS DENTRO DE LA TINTA
// La incisión de un cruce es del COLOR DEL FONDO y mide gap. Una costura
// es otra cosa: una línea MEZCLADA —ni tinta ni fondo— que aparece donde
// dos trozos de la misma cinta se encuentran. El detector de la incisión
// no la ve, porque sólo mira cruces.
//
// Se busca el píxel que (a) no es tinta ni fondo dentro de tolerancia y
// (b) tiene tinta a los cuatro lados a 3 px. El borde exterior de la
// cinta también está mezclado, pero ahí hay fondo a un lado.
// ============================================================
const S = 900, T = window.__TRZS;
const lienzo = () => { const c=document.createElement('canvas'); c.width=c.height=S; return c; };
window.costuras = (seed, pals, extra) => {
  const cfg = Object.assign({ paletas: pals, aspecto: 1, dots: 'no' }, extra || {});
  const c = T.generate(seed, cfg);
  const cA = lienzo(), xA = cA.getContext('2d');
  const rr0 = T.renderComposition(xA, 0, 0, S, c, S, true, false);
  const m0 = rr0.mapped, W0 = rr0.width;
  const d = xA.getImageData(0,0,S,S).data;
  const hex = h => [1,3,5].map(k=>parseInt(h.substr(k,2),16));
  const B = hex(c.colores.bg), F = hex(c.colores.fg), F2 = hex(c.colores.fg2);
  // fg2 SOLO se pinta cuando hay dos cintas. Con una sola es, por construccion,
  // mixHex(fg, bg, 0.38): el color exacto de un pixel mezclado al 38%. Tomarlo
  // por tinta hacia que el filo antialias contara como tinta, y con ello
  // cualquier mezcla rodeada de filos pasaba por costura.
  const dosCintas = (c.saltos || []).length > 0;   // dos tintas en cuanto hay un salto
  const cerca = (i,C,t) => Math.abs(d[i]-C[0])+Math.abs(d[i+1]-C[1])+Math.abs(d[i+2]-C[2]) < t;
  // Se pregunta por los colores de la obra en vez de suponerlos: en el trazo
  // fantasma la cinta va del color del suelo y su incision es un tono corrido,
  // asi que buscando la tinta por `fg` no se encuentra ni una y buscando el
  // fondo por `bg` se encuentra la cinta entera. Ese 3,5% de obras estaba
  // excluido de la bateria por eso.
  const mismo = (a,b) => String(a).toLowerCase() === String(b).toLowerCase();
  // Y NO SE FILTRA POR SER TINTA DE ALGUIEN: un color puede ser las dos cosas.
  // En una obra fantasma de dos cintas el fondo es a la vez el corte de la cinta
  // normal y la tinta del fantasma. Filtrarlo —que se probó, buscando que un
  // tono de corte no pudiera ser tinta— se lleva por delante la incisión
  // legítima de la otra cinta y la obra entera se lee como rota: 72 de 72 obras
  // y 88.646 px de costura. La lista de cortes son los halos TAL CUAL, más el
  // fondo si no es tinta de nadie; y se pregunta por el corte ANTES que por la
  // tinta, que es lo que resuelve el empate donde lo hay.
  const esTintaDe = (col) => (rr0.tintas||[]).some(t => mismo(t, col));
  // Y la TINTA tambien se pregunta, no se supone: en una obra fantasma el
  // cuerpo va del color del suelo, asi que buscandolo por `fg` no se encuentra.
  const TINTAS = (rr0.tintas||[]).filter(t => typeof t === 'string').map(hex);
  const CORTES = (rr0.halos||[]).map(hex)
                   .concat(esTintaDe(c.colores.bg) ? [] : [B]);
  const esTinta = i => TINTAS.some(C => cerca(i,C,30)) ||
                       cerca(i,F,30) || (dosCintas && cerca(i,F2,30));
  const esFondo = i => CORTES.some(C => cerca(i,C,30));
  const idx = (x,y) => 4*(y*S+x);
  let mez = 0; const pts = [], todos = [];
  for (let y=3;y<S-3;y++) for (let x=3;x<S-3;x++){
    const i = idx(x,y);
    if (esTinta(i) || esFondo(i)) continue;          // tinta limpia o fondo limpio
    let n = 0;
    if (esTinta(idx(x-3,y))) n++;
    if (esTinta(idx(x+3,y))) n++;
    if (esTinta(idx(x,y-3))) n++;
    if (esTinta(idx(x,y+3))) n++;
    if (n < 4) continue;
    // Y NADA DE FONDO CERCA. Una costura es una raya mezclada METIDA EN LA
    // TINTA; el filo de una incisión también está mezclado, y en la PUNTA de
    // una incisión —una cuña que se cierra— la cuña es más estrecha que el
    // sondeo, así que los cuatro brazos caen en tinta y el filo pasaba por
    // costura. Con el temblor esas puntas se agudizan y salían 2 obras de 85
    // con 30 px cada una, con la incisión perfectamente dibujada al lado.
    // Una costura de verdad no tiene fondo a tres píxeles por ningún lado.
    let fondoCerca = false;
    for (let dx=-3; dx<=3 && !fondoCerca; dx++)
      for (let dy=-3; dy<=3; dy++) {
        if (!dx && !dy) continue;
        if (esFondo(idx(x+dx,y+dy))) { fondoCerca = true; break; }
      }
    if (fondoCerca) continue;
    { mez++; todos.push([x,y]); if (pts.length < 5) pts.push([x,y]); }
  }
  // ¿Dónde caen? Distancia de cada píxel de costura a la junta más cercana y
  // al cruce más cercano. Si el mecanismo es la junta, saldrá pegado a ellas.
  const acum = T.arcosDe(m0), tot = acum[acum.length-1];
  const pJ = (c.plano.juntas||[]).map(j => T.puntoEnArco(m0,acum,T.arcoDeParam(m0,acum,j)));
  const pX = c.cruces.map(q => T.puntoEnArco(m0,acum,T.arcoDeParam(m0,acum,q.arriba)));
  const cercaDe = (p, lista) => { let mn = 1e9;
    for (const q of lista) mn = Math.min(mn, Math.hypot(q.x-p[0], q.y-p[1]));
    return lista.length ? Math.round(mn) : null; };
  const dJ = todos.map(p => cercaDe(p, pJ)).filter(x => x != null);
  const dX = todos.map(p => cercaDe(p, pX)).filter(x => x != null);
  const med = a => a.length ? a.slice().sort((x,y)=>x-y)[Math.floor(a.length/2)] : null;
  return { seed, mez, pts, tipo: c.tipo, cruces: c.cruces.length,
           secs: c.plano.secciones.length, juntas: (c.plano.juntas||[]).length,
           W: Math.round(W0), aJunta: med(dJ), aCruce: med(dX),
           pegadosAJunta: dJ.filter(x=>x<=Math.round(W0)).length, nCos: dJ.length };
};
window.__ok = true;
</script></body></html>
