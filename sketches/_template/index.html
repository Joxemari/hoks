<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>template · lab — hoks</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ink:#111; --ink3:#bbb; --border:#e8e8e8; --surface:#f7f7f7; --f:'Courier New',Courier,monospace; }
  body { font-family: var(--f); background: #fff; color: var(--ink); display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
  .panel { border-right: 1px solid var(--border); padding: 1.2rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1.1rem; }
  .lab-title { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
  .lab-title small { display:block; font-weight:400; color:var(--ink3); letter-spacing:0.1em; margin-top:3px; }
  .group { display: flex; flex-direction: column; gap: 6px; }
  .lbl { font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink3); }
  .row { display:flex; align-items:center; gap:6px; }
  input[type=range] { width: 100%; accent-color: var(--ink); cursor: pointer; }
  input[type=number], select { font-family: var(--f); font-size: 11px; padding: 5px 7px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 2px; width: 100%; }
  .val { font-size: 11px; font-weight: 700; min-width: 30px; text-align: right; color: var(--ink3); }
  .hintline { font-size: 9px; color: var(--ink3); letter-spacing: 0.04em; }
  button { font-family: var(--f); font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 2px; padding: 8px; cursor: pointer; width: 100%; }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--border); }
  button:hover { opacity: 0.78; }
  .seed-box { display:flex; gap:4px; }
  .seed-box button { width:34px; padding:6px 0; }
  .seed-box input { text-align:center; }
  .stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 1.5rem; background: var(--surface); overflow: auto; }
  #single { max-width: min(100%, calc((100vh - 120px) * 1.414)); max-height: calc(100vh - 120px); outline: 1px solid rgba(0,0,0,0.12); display:block; }
  .sheet { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-width: 980px; }
  .sheet canvas { width: 100%; outline: 1px solid rgba(0,0,0,0.1); cursor: pointer; display:block; }
  .sheet figcaption { padding: 3px 2px; font-size: 9px; color: var(--ink3); letter-spacing: 0.04em; }
  .hint { font-size: 9px; color: var(--ink3); letter-spacing: 0.1em; text-transform: uppercase; }
  .traits { font-size: 10px; display:flex; flex-direction:column; gap:4px; }
  .traits .t { display:flex; justify-content:space-between; gap:6px; }
  .traits .k { color: var(--ink3); text-transform: uppercase; font-size: 9px; letter-spacing:0.06em; }
  .traits .v { font-weight: 700; }
  .dots { display:inline-flex; gap:2px; vertical-align:middle; margin-right:5px; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; border:0.5px solid rgba(0,0,0,0.1); }
</style>
</head>
<body>
  <aside class="panel">
    <div class="lab-title">template · lab<small>clóname para una obra nueva</small></div>
    <div class="group">
      <span class="lbl">Work</span>
      <div id="workPicker"></div>
    </div>
    <div class="group">
      <span class="lbl">Format</span>
      <select id="fmt">
        <option value="square">□ Square (1:1)</option>
        <option value="vertical">▯ Vertical (1:√2)</option>
        <option value="horizontal">▭ Horizontal (√2:1)</option>
      </select>
      <span class="hintline">proporción DIN — misma seed, otra composición</span>
    </div>
    <div class="group">
      <span class="lbl">Seed</span>
      <div class="seed-box">
        <button class="ghost" id="prev">◀</button>
        <input type="number" id="seed" value="0">
        <button class="ghost" id="next">▶</button>
      </div>
      <button id="rnd">↻ New seed (space)</button>
    </div>
    <div class="group">
      <span class="lbl">Palette · <span id="palCount">…</span></span>
      <div id="palPicker"></div>
      <span class="hintline">incluye activas e inactivas</span>
    </div>
    <div class="group">
      <span class="lbl">Background</span>
      <select id="bg">
        <option value="auto">Auto (lo propio de la obra)</option>
        <option value="solid">Solid</option>
        <option value="gradient">Gradient</option>
      </select>
      <span class="hintline">transversal: es lo que separaba a KRT de KRTG</span>
    </div>
    <div class="group">
      <span class="lbl">Grain (×) · <span id="grainV">1.0</span></span>
      <input type="range" id="grain" min="0" max="2" step="0.1" value="1">
    </div>
    <div class="group">
      <span class="lbl">Count · <span id="countV">auto</span></span>
      <input type="range" id="count" min="0" max="60" step="1" value="0">
      <span class="hintline">0 = aleatorio</span>
    </div>
    <div class="group">
      <span class="lbl">Batch</span>
      <div id="batchPanel"></div>
    </div>
    <div class="group">
      <button id="save">↓ Save PNG (s)</button>
      <button class="ghost" id="sheet">▦ Contact sheet (g)</button>
    </div>
    <div class="group"><span class="lbl">Traits</span><div class="traits" id="traits"></div></div>
  </aside>

  <main class="stage">
    <canvas id="single" width="1000" height="1000"></canvas>
    <div class="sheet" id="sheetGrid" style="display:none"></div>
    <span class="hint" id="status">—</span>
  </main>

<script src="../../palette-picker.js"></script>
<script src="../../usage.js"></script>
<script src="../_lab.js"></script>
<script src="../_batch.js"></script>
<script src="../_engine.js"></script>
<script src="./algo.js"></script>
<script>
const WORK = HOKS.TEMPLATE;        // ← cámbialo al namespace de tu obra
const BASE = 1000, SHEET_BASE = 300;   // lado corto: hoja y hoja de contactos
const SHEET_N = 12;
let FORMAT = 'square';                 // formato de partida de la obra
let W, H, SHEET_W, SHEET_H;
// El formato es del ALGORITMO, no del lienzo: se le pasan W y H y él se adapta.
function applyFormat() {
  const d = HOKS.fmtDims(FORMAT, BASE);      W = d.W; H = d.H;
  const t = HOKS.fmtDims(FORMAT, SHEET_BASE); SHEET_W = t.W; SHEET_H = t.H;
  single.width = W; single.height = H;
}

const single = document.getElementById('single');
const sctx = single.getContext('2d');
let PALETTES = HOKS.normalizePalettes(HOKS.DEFAULTS);
let seed = HOKSLAB.initialSeed();
let sheetMode = false;
const $ = id => document.getElementById(id);

function params() { return { bg: $('bg').value, grainScale: parseFloat($('grain').value), count: parseInt($('count').value, 10) || 0 }; }
let palPicker = null;
function palOpts() { return palPicker ? palPicker.opts() : { palettes: PALETTES }; }

let batch = null;
const SLUG = '_template';
// La receta ES la pieza: seed + params + paleta + FORMATO (la proporción cambia
// la composición, no solo el recorte). El nombre de la paleta se resuelve con un
// render de 8px —el stream del RNG no depende del tamaño— para detectar deriva.
function recipeFor(s) {
  const c = document.createElement('canvas'); c.width = c.height = 8;
  let palName = null;
  try { const r = WORK.render(c.getContext('2d'), 8, 8, s >>> 0, { ...palOpts(), params: params() }); palName = r && r.pal && r.pal.name; } catch (e) {}
  return { work: SLUG, seed: s >>> 0, format: FORMAT, base: BASE, params: params(),
           palSel: palPicker ? palPicker.selection : 'auto', palName };
}

function renderSingle() {
  $('seed').value = seed;
  try {
    const res = WORK.render(sctx, W, H, seed >>> 0, { ...palOpts(), params: params() });
    $('status').textContent = `seed #${seed}`;
    drawTraits(WORK.traits(res));
  } catch (e) { $('status').textContent = '⚠ ' + e.message; console.error(e); }
}
function drawTraits(t) {
  $('traits').innerHTML = t.list.map(x => `
    <div class="t"><span class="k">${x.key}</span>
    <span class="v">${x.colors ? `<span class="dots">${x.colors.slice(0,6).map(c=>`<span class="dot" style="background:${c}"></span>`).join('')}</span>` : ''}${x.val}</span></div>`).join('') +
    `<div class="t" style="margin-top:4px;border-top:1px solid var(--border);padding-top:5px;"><span class="k">Overall</span><span class="v">${t.overall}</span></div>`;
}
function renderSheet() {
  const grid = $('sheetGrid'); grid.innerHTML = '';
  const base = seed >>> 0;
  for (let i = 0; i < SHEET_N; i++) {
    const s = (base + i * 0x9E3779B1) >>> 0;
    const c = document.createElement('canvas'); c.width = SHEET_W; c.height = SHEET_H;
    try { WORK.render(c.getContext('2d'), SHEET_W, SHEET_H, s, { ...palOpts(), params: params() }); } catch (e) {}
    const fig = document.createElement('figure'); const cap = document.createElement('figcaption'); cap.textContent = '#' + s;
    fig.style.position = 'relative';
    fig.appendChild(c); fig.appendChild(cap);
    c.addEventListener('click', () => { seed = s; setSheet(false); });
    // El ojo decide mirando las doce: apartar una tiene que ser un gesto de aquí.
    const plus = document.createElement('button');
    plus.className = 'hb-add'; plus.textContent = '+'; plus.title = 'Añadir al lote (a)';
    plus.onclick = ev => { ev.stopPropagation(); if (batch && batch.add(s)) { plus.classList.add('done'); plus.textContent = '✓'; } };
    fig.appendChild(plus);
    grid.appendChild(fig);
  }
}
function setSheet(on) {
  sheetMode = on;
  $('single').style.display = on ? 'none' : 'block';
  $('sheetGrid').style.display = on ? 'grid' : 'none';
  $('sheet').textContent = on ? '▦ Single view (g)' : '▦ Contact sheet (g)';
  if (on) { renderSheet(); $('status').textContent = `${SHEET_N} variations from #${seed}`; } else renderSingle();
}
function refresh() { sheetMode ? renderSheet() : renderSingle(); }
function populateSelect() {
  $('palCount').textContent = PALETTES.length;
  if (palPicker) palPicker.setPalettes(PALETTES);
  else palPicker = HOKSLAB.mountPalettePicker($('palPicker'), { palettes: PALETTES, onChange: refresh });
}

$('rnd').onclick = () => { seed = (Math.random() * 0xFFFFFFFF) >>> 0; refresh(); };
$('prev').onclick = () => { seed = (seed - 1) >>> 0; refresh(); };
$('next').onclick = () => { seed = (seed + 1) >>> 0; refresh(); };
$('seed').onchange = () => { seed = (parseInt($('seed').value, 10) || 0) >>> 0; refresh(); };
$('count').oninput = () => { $('countV').textContent = $('count').value === '0' ? 'auto' : $('count').value; refresh(); };
$('bg').onchange = refresh;
$('grain').oninput = () => { $('grainV').textContent = parseFloat($('grain').value).toFixed(1); refresh(); };
$('sheet').onclick = () => setSheet(!sheetMode);
$('save').onclick = () => { if (sheetMode) setSheet(false); const a = document.createElement('a'); a.download = `template_${seed}.png`; a.href = single.toDataURL('image/png'); a.click(); };

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); seed = (Math.random() * 0xFFFFFFFF) >>> 0; refresh(); }
  else if (e.key === 'ArrowRight') { seed = (seed + 1) >>> 0; refresh(); }
  else if (e.key === 'ArrowLeft') { seed = (seed - 1) >>> 0; refresh(); }
  else if (e.key === 's' || e.key === 'S') $('save').click();
  else if (e.key === 'g' || e.key === 'G') setSheet(!sheetMode);
  else if (e.key === 'a' || e.key === 'A') { if (batch) batch.add(seed); }
});

// Init: pinta YA con fallback, luego trae TODAS las paletas.
populateSelect();
$('fmt').value = FORMAT;
$('fmt').onchange = () => { FORMAT = $('fmt').value; applyFormat(); refresh(); };
HOKSLAB.mountWorkPicker($('workPicker'), '_template', () => seed);
batch = HOKSBATCH.mount($('batchPanel'), {
  work: SLUG, getRecipe: recipeFor, getPalettes: () => PALETTES, getSeed: () => seed,
  toast: m => { $('status').textContent = m; },
});
// Un lote puede mezclar obras: para pintar su tira hacen falta todos los algos.
HOKSLAB.loadAlgos(() => batch.refresh());
applyFormat();
renderSingle();
HOKS.loadAllPalettes().then(p => { if (p && p.length) { PALETTES = p; populateSelect(); refresh(); } }).catch(() => {});
</script>
</body>
</html>
