name: editorial agent

on:
  issue_comment:
    types: [created]

concurrency:
  group: editorial-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      (github.event.comment.body == 'aprobar dirección' ||
       github.event.comment.body == 'aprobar publicación')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Ejecutar orden editorial
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Procesa la orden editorial del comentario que ha disparado este flujo.

            Lee primero AGENTS.md, CLAUDE.md, BRAND.md y
            docs/EDITORIAL_AUTOMATION.md. La issue es el expediente operativo y
            su descripción contiene la propuesta, el activo, el copy y el
            enlace al registro de Notion.

            La orden exacta es: ${{ github.event.comment.body }}

            Sigue el contrato de autorización literalmente:

            - "aprobar dirección": prepara los activos y el copy final en una
              rama nueva, abre una PR y comenta en la issue con el enlace. No
              publiques en redes y no cierres la issue.
            - "aprobar publicación": solo es válida si la issue ya enlaza los
              activos finales, el copy está aprobado y la verificación de
              formato consta como completada. Si falta algo, responde con el
              bloqueo concreto. Si todo está listo pero las herramientas de
              publicación no están disponibles en este runner, responde
              solicitando la ejecución por un agente conectado; no simules ni
              declares una publicación.

            Nunca trabajes sobre main, nunca hagas merge y nunca expongas
            secretos. Conserva en la PR la comparación anterior → nuevo y la
            verificación realizada. Responde siempre en la issue con el
            resultado o el bloqueo.
          claude_args: |
            --max-turns 12
