<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #fff; color: #111; }
.about-wrap { padding: 10rem 2rem 6rem; max-width: 640px; margin: 0 auto; }
#about-text {
  font-family: 'Courier New', Courier, monospace;
  font-size: clamp(0.9rem, 1.8vw, 1.1rem);
  font-weight: 400; line-height: 1.8; color: #111;
  margin-bottom: 3rem; letter-spacing: 0.01em;
  white-space: pre-line;
  visibility: hidden;
}
.about-contact {
  font-family: 'Courier New', Courier, monospace;
  font-size: 11px; color: #aaa;
  letter-spacing: 0.1em; text-transform: uppercase;
}
.about-contact a { color: #111; text-decoration: none; border-bottom: 1px solid #111; }
</style>
</head>
<body>
<script src="nav.js"></script>
<main>
  <div class="about-wrap">
    <p id="about-text"></p>
    <p class="about-contact" id="about-contact"></p>
  </div>
</main>
<script>
const FALLBACK = 'hoks is the work of Joxemari Gallastegi, a generative artist based in Donostia. He studied at Stanford University, where he presented his first solo exhibition.\n\nThe work begins where a rule is written. Each series is a small system — a grammar of modules, geometry and controlled chance — and every piece is one sentence that grammar can utter: a seed, a deterministic sequence, an image. Same seed, same image. Nothing is retouched.\n\nThere is a virtue in modularity: a module explains nothing on its own. It asks for repetition, for contact, for a shared edge. The unit is kept deliberately poor so that the field can be rich — meaning does not live in the pieces but between them.\n\nWhat reaches the screen is not the subject of the work but its residue: the visible trace of a system thinking. The series matter more than the pieces; the rules matter more than the series.';

fetch('https://raw.githubusercontent.com/Joxemari/hoks/main/data/site.json?t=' + Date.now())
  .then(r => r.ok ? r.json() : null)
  .then(d => {
    const t = document.getElementById('about-text');
    const c = document.getElementById('about-contact');
    if (t) {
      t.textContent = d?.aboutText || FALLBACK;
      t.style.visibility = 'visible';
    }
    if (c && d?.footerEmail) {
      c.innerHTML = 'Contact: <a href="mailto:' + d.footerEmail + '">' + d.footerEmail + '</a>';
    }
  })
  .catch(() => {
    const t = document.getElementById('about-text');
    if (t) { t.textContent = FALLBACK; t.style.visibility = 'visible'; }
  });
</script>
</body>
</html>
