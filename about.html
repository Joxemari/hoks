<head>
<meta charset="UTF-8">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #fff; color: #111; }
.about-wrap { padding: 10rem 2rem 6rem; max-width: 640px; margin: 0 auto; }
#about-text {
  font-family: 'Courier New', Courier, monospace;
  font-size: clamp(0.9rem, 1.8vw, 1.1rem);
  font-weight: 400; line-height: 1.8; color: #111;
  margin-bottom: 3rem; letter-spacing: 0.01em;
  white-space: pre-line;
  visibility: hidden;
}
.about-contact {
  font-family: 'Courier New', Courier, monospace;
  font-size: 11px; color: #aaa;
  letter-spacing: 0.1em; text-transform: uppercase;
}
.about-contact a { color: #111; text-decoration: none; border-bottom: 1px solid #111; }
</style>
</head>
<body>
<script src="nav.js"></script>
<main>
  <div class="about-wrap">
    <p id="about-text"></p>
    <p class="about-contact" id="about-contact"></p>
  </div>
</main>
<script>
// aboutText en site.json puede ser una cadena (legado, se trata como EN) o un
// objeto {en,es,eu}. Si falta el idioma actual, se cae al texto poético de i18n.
let siteData = null;

function pickAbout(lang) {
  const a = siteData && siteData.aboutText;
  if (a && typeof a === 'object') {
    return a[lang] || a.en || a.es || a.eu || (window.HOKSI18N && HOKSI18N.t('about.fallback'));
  }
  if (typeof a === 'string' && a.trim()) {
    // Cadena legada: solo sirve para EN; el resto usa el texto poético traducido.
    return lang === 'en' ? a : (window.HOKSI18N && HOKSI18N.t('about.fallback'));
  }
  return window.HOKSI18N ? HOKSI18N.t('about.fallback') : '';
}

function renderAbout() {
  const lang = window.HOKSI18N ? HOKSI18N.lang : 'en';
  const t = document.getElementById('about-text');
  const c = document.getElementById('about-contact');
  if (t) {
    t.textContent = pickAbout(lang) || '';
    t.style.visibility = 'visible';
  }
  if (c) {
    const email = (siteData && siteData.footerEmail) || 'joxemgallastegi@gmail.com';
    const label = window.HOKSI18N ? HOKSI18N.t('footer.contact') : 'Contact';
    c.innerHTML = label + ': <a href="mailto:' + email + '">' + email + '</a>';
  }
}

fetch('https://raw.githubusercontent.com/Joxemari/hoks/main/data/site.json?t=' + Date.now())
  .then(r => r.ok ? r.json() : null)
  .then(d => { siteData = d; renderAbout(); })
  .catch(() => { renderAbout(); });

window.addEventListener('hoks:langchange', renderAbout);
</script>
</body>
</html>
