<style>
/* Tokens (:root) y League Spartan los pone nav.js. Estética del mockup
   About.dc.html: columna estrecha, statement en cuerpo, y la marca pintada a
   mano de coda junto al contacto. */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--geo); }
.about-wrap { padding: 8rem 1.5rem 6rem; max-width: 640px; margin: 0 auto; }
.about-eye { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; color: var(--blue); margin-bottom: 22px; }
#about-text {
  font-family: var(--geo); font-size: 17.5px; line-height: 1.8; color: var(--body);
  white-space: pre-line; margin: 0; visibility: hidden;
}
.about-coda { margin-top: 52px; padding-top: 38px; border-top: 1px solid var(--line);
  display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; }
.about-coda .mark { display: block; height: 150px; width: auto; }
.about-contact { font-family: var(--mono); font-size: 12px; color: var(--mut); letter-spacing: 0.08em; white-space: nowrap; margin: 0; }
.about-contact a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--ink); }
@media (max-width: 600px) { .about-coda { flex-direction: column; align-items: flex-start; gap: 22px; } .about-coda .mark { height: 120px; } }
</style>
</head>
<body>
<script src="nav.js"></script>
<main>
  <div class="about-wrap">
    <div class="about-eye">hoks - algorithmic art</div>
    <p id="about-text"></p>
    <div class="about-coda">
      <img class="mark" src="logo_tall.png" alt="hoks">
      <p class="about-contact" id="about-contact"></p>
    </div>
  </div>
</main>
<script>
// aboutText en site.json puede ser una cadena (legado, se trata como EN) o un
// objeto {en,es,eu}. Si falta el idioma actual, se cae al texto poético de i18n.
let siteData = null;

function pickAbout(lang) {
  const a = siteData && siteData.aboutText;
  if (a && typeof a === 'object') {
    return a[lang] || a.en || a.es || a.eu || (window.HOKSI18N && HOKSI18N.t('about.fallback'));
  }
  if (typeof a === 'string' && a.trim()) {
    // Cadena legada: solo sirve para EN; el resto usa el texto poético traducido.
    return lang === 'en' ? a : (window.HOKSI18N && HOKSI18N.t('about.fallback'));
  }
  return window.HOKSI18N ? HOKSI18N.t('about.fallback') : '';
}

function renderAbout() {
  const lang = window.HOKSI18N ? HOKSI18N.lang : 'en';
  const t = document.getElementById('about-text');
  const c = document.getElementById('about-contact');
  if (t) {
    t.textContent = pickAbout(lang) || '';
    t.style.visibility = 'visible';
  }
  if (c) {
    const email = (siteData && siteData.footerEmail) || 'joxemgallastegi@gmail.com';
    const label = window.HOKSI18N ? HOKSI18N.t('footer.contact') : 'Contact';
    c.innerHTML = label + ': <a href="mailto:' + email + '">' + email + '</a>';
  }
}

fetch('https://raw.githubusercontent.com/Joxemari/hoks/main/data/site.json?t=' + Date.now())
  .then(r => r.ok ? r.json() : null)
  .then(d => { siteData = d; renderAbout(); })
  .catch(() => { renderAbout(); });

window.addEventListener('hoks:langchange', renderAbout);
</script>
</body>
</html>
