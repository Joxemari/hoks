<!doctype html>
<html>
<head>
  <meta charset="utf-8">
<link rel="icon" type="image/png" href="/favicon.png">
  <!-- Banco de render para los vídeos de feed-fábrica. No es una página del
       sitio: lo abre make-videos.mjs para capturar fotogramas. Carga el motor
       y los algo.js reales, así que los vídeos SON la obra, no una imitación. -->
  <style> html,body{margin:0;background:#0c0c0c} #c{display:block} </style>
</head>
<body>
<canvas id="c" width="1080" height="1080"></canvas>
<script src="../sketches/_engine.js?v=1"></script>
<script src="../sketches/plls/algo.js?v=1"></script>
<script src="../sketches/krrtk/algo.js?v=1"></script>
<script src="../sketches/dtk/algo.js?v=1"></script>
<script src="../sketches/dtkrt/algo.js?v=1"></script>
<script src="../sketches/trzs/algo.js?v=1"></script>
<script src="../sketches/eclps/algo.js?v=1"></script>
<script src="kit.js"></script>
<script>
var H=window.HOKS, P=window.HOKSPOST, C=document.getElementById('c'), CX=C.getContext('2d');
// Dos modos. A pantalla completa (resize): la obra ES el fotograma y el
// algoritmo se recompone a esa proporción. Maquetado (layout): la obra va a su
// tamaño de pieza y kit.js la pone en página, como las otras casillas de la fila.
var LAYOUT=null, WW=C.width, WH=C.height, ASM=null;
function show(src){
  if(LAYOUT){ P.piece(src, LAYOUT.fmt, null, {mat:LAYOUT.mat, stamp:false, into:C}); return; }
  CX.setTransform(1,0,0,1,0,0); CX.clearRect(0,0,C.width,C.height); CX.drawImage(src,0,0); }
function blank(w,h){ var c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
var PALS=(H.normalizePalettes?H.normalizePalettes(H.DEFAULTS):H.DEFAULTS)||[];
function rgb(h){h=(''+h).replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function luma(p){var a=p.colors||[],s=0;a.forEach(function(h){var c=rgb(h);s+=(0.299*c[0]+0.587*c[1]+0.114*c[2])/255;});return a.length?s/a.length:1;}
var BRIGHT=PALS.filter(function(p){return luma(p)>0.42;}); if(!BRIGHT.length)BRIGHT=PALS.slice();
function palByName(n){ for(var i=0;i<PALS.length;i++) if(PALS[i].name===n) return PALS[i]; return null; }
function optsFor(w,h,pal){ var o={params:{field:(w===h?'square':'sheet'),grainScale:1}}; if(pal){o.palettes=[pal];o.locked=true;o.lockedIdx=0;} return o; }
function palFor(seed,palName){ return palName?palByName(palName):BRIGHT[(seed>>>3)%BRIGHT.length]; }
window.full=function(fam,seed,palName){ var pal=palFor(seed,palName), w=WW, h=WH, fc=blank(w,h), x=fc.getContext('2d');
  try{H[fam].render(x,w,h,seed,optsFor(w,h,pal));}catch(e){x.fillStyle='#111';x.fillRect(0,0,w,h);} show(fc); };

// ── assembling: se graban las llamadas de dibujo y se reproducen (fondo
//    primero, luego cada objeto). El mecanismo vive en kit.js (HOKSPOST.assembly).
window.setup=function(fam,seed,palName){ var pal=palFor(seed,palName), w=WW, h=WH;
  ASM=P.assembly(function(x){ try{H[fam].render(x,w,h,seed,optsFor(w,h,pal));}catch(e){} }, w, h);
  return ASM.steps; };
window.step=function(frac){ if(ASM) show(ASM.at(frac)); };
window.resize=function(w,h){ LAYOUT=null; C.width=w; C.height=h; WW=w; WH=h; };
// La fila del grid: la obra a su tamaño de pieza, maquetada como la pieza.
window.layout=function(fmt,mat){ LAYOUT={fmt:fmt, mat:mat||'paper'}; var L=P.layout(fmt);
  C.width=L.W; C.height=L.H; WW=WH=P.srcSize(fmt,'piece'); return [L.W,L.H]; };
window.__ready=true;
</script>
</body>
</html>
