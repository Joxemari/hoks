<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hoks — palettes</title>
<!-- Cabecera para lectores no humanos. Estática a propósito: los fetchers
     de agente no ejecutan JS. Ver CLAUDE.md § Buscadores y agentes. -->
<meta name="description" content="The colour catalogue behind every hoks piece: named palettes chosen by weight at draw time, with the ones still in play and the ones retired.">
<link rel="canonical" href="https://hoks.design/palettes.html">
<meta property="og:title" content="hoks — palettes">
<meta property="og:description" content="The colour catalogue behind every hoks piece: named palettes chosen by weight at draw time, with the ones still in play and the ones retired.">
<meta property="og:url" content="https://hoks.design/palettes.html">
<meta property="og:type" content="website">
<style>
/* Sistema de diseño 2026: tokens (--paper/--ink/--blue/--acid/--line/--mut/--body/--red,
   --geo League Spartan, --mono SF Mono/JetBrains Mono) los inyecta nav.js en :root. Aquí solo
   añadimos el radio de tarjeta local. */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --r: 12px; }
body { font-family: var(--geo); background: var(--paper); color: var(--ink); min-height: 100vh; padding-bottom: 6rem; }
/* Cabecera de página: título display + sub-línea mono azul. */
.page-head { width: 100%; max-width: 1180px; margin: 34px auto 0; padding: 0 2rem; }
.page-head h1 { font-family: var(--geo); font-weight: 700; font-size: 48px; letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink); margin: 0 0 4px; }
.page-head .sub { font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--blue); }
.controls {
  max-width: 1180px; margin: 26px auto 0;
  padding: 1.2rem 2rem;
  display: flex; gap: 14px; align-items: center;
  border-bottom: 1px solid var(--line);
  justify-content: space-between;
}
.controls-left { display: flex; gap: 14px; align-items: center; flex: 1; }
.controls-right { flex-shrink: 0; }
.search-wrap { flex: 1; min-width: 160px; max-width: 320px; }
.search-wrap input {
  width: 100%; background: #fff; border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 14px; font-family: var(--mono);
  font-size: 12px; color: var(--body); outline: none; letter-spacing: 0.04em;
  transition: border-color 0.15s;
}
.search-wrap input:focus { border-color: var(--blue); }
.search-wrap input::placeholder { color: var(--mut); text-transform: uppercase; letter-spacing: 0.08em; }
.sort-select { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--body); cursor: pointer; outline: none; }
.sort-select:focus { border-color: var(--blue); }
.count { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mut); white-space: nowrap; margin-left: auto; }
/* Rejilla de uso: una celda por paleta, tono azul según cuántas obras guardadas la usan. */
/* width:100% porque nav.js pone el body en flex column: si no, encoge al contenido. */
.usage { width: 100%; max-width: 1180px; margin: 24px auto 0; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--r); background: #fff; }
.usage-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.usage-title { font-family: var(--geo); font-weight: 700; font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; background: var(--red); color: #fff; padding: 2px 7px; border-radius: 2px; }
.usage-sub { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mut); }
.usage-grid { display: grid; grid-template-columns: repeat(12, 13px); gap: 3px; width: max-content; }
.ucell { width: 13px; height: 13px; border-radius: 2px; cursor: pointer; outline: 1px solid transparent; outline-offset: 1px; transition: outline-color 0.12s; }
.ucell:hover { outline-color: var(--ink); }
.u0 { background: #e9edff; }
.u1 { background: #b9c4ff; }
.u2 { background: #7d8dff; }
.u3 { background: #3b4cf0; }
.u4 { background: var(--blue); }
.ucell.off { box-shadow: inset 0 0 0 1px var(--mut); }   /* paleta retirada */
.ucell.off.u0 { background: var(--paper); }
.usage-legend { display: flex; align-items: center; gap: 4px; margin-top: 13px; font-family: var(--mono); font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mut); }
.usage-legend i { width: 9px; height: 9px; border-radius: 2px; }
.usage-empty { font-family: var(--mono); font-size: 10px; color: var(--mut); letter-spacing: 0.06em; text-transform: uppercase; }
.usage-copy { font-family: var(--mono); font-size: 8px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mut); background: none; border: 1px solid var(--line); border-radius: 2px; padding: 3px 8px; cursor: pointer; margin-left: auto; transition: color 0.12s, border-color 0.12s; }
.usage-copy:hover { color: var(--ink); border-color: var(--blue); }
.usage-chip { font-family: var(--mono); font-size: 8px; font-weight: 700; letter-spacing: 0.08em; color: var(--body); border: 1px solid var(--mut); border-radius: 20px; padding: 1px 6px; flex-shrink: 0; }
.grid { max-width: 1180px; margin: 24px auto 0; padding: 0 2rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
.palette-card { background: #fff; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; transition: border-color 0.15s; }
.palette-card:hover { border-color: var(--blue); }
.palette-card.inactive { filter: grayscale(1); opacity: 0.45; }
.swatches { display: flex; height: 72px; overflow: hidden; }
.swatch { flex: 1; cursor: pointer; position: relative; transition: flex 0.25s cubic-bezier(0.4,0,0.2,1); }
.swatch:hover { flex: 2.5; }
.swatch-tip { position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.65); color: #fff; font-family: var(--mono); font-size: 8px; font-weight: 700; padding: 2px 6px; border-radius: 2px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.12s; letter-spacing: 0.04em; }
.swatch:hover .swatch-tip { opacity: 1; }
.card-body { padding: 14px 16px 6px; flex: 1; }
.card-name-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
.card-name { font-family: var(--geo); font-size: 16px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); }
.inactive-tag { font-family: var(--geo); font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mut); border: 1px solid var(--line); border-radius: 20px; padding: 3px 9px; flex-shrink: 0; }
.card-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 3px; }
.card-date { font-family: var(--mono); font-size: 9px; color: var(--mut); letter-spacing: 0.04em; }
.prob-badge { font-family: var(--geo); font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 4px 9px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; border: 1px solid var(--line); color: var(--body); }
.prob-common    { background: #f1efe8; color: #5f5e5a; border-color: #f1efe8; }
.prob-uncommon  { background: #e1f5ee; color: #085041; border-color: #e1f5ee; }
.prob-rare      { background: #e6f1fb; color: #0c447c; border-color: #e6f1fb; }
.prob-superrare { background: #eeedfe; color: #3c3489; border-color: #eeedfe; }
.prob-legendary { background: var(--acid); color: var(--ink); border-color: var(--acid); }
.card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.tag { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.05em; color: var(--mut); border: 1px solid var(--line); border-radius: 20px; padding: 3px 8px; }
.card-footer { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 12px; gap: 6px; margin-top: auto; }
.hex-list { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.hex-chip { font-family: var(--mono); font-size: 10px; letter-spacing: 0.03em; color: var(--mut); cursor: pointer; transition: color 0.12s; }
.hex-chip:hover { color: var(--ink); }
.card-actions { display: flex; gap: 2px; flex-shrink: 0; }
.btn-icon { background: none; border: none; cursor: pointer; color: var(--mut); font-size: 13px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 8px; transition: color 0.12s, background 0.12s; }
.btn-icon:hover { color: var(--ink); background: var(--paper); }
.empty-state { grid-column: 1/-1; padding: 5rem 2rem; text-align: center; }
.empty-big { font-family: var(--geo); font-size: 1.4rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--mut); margin-bottom: 6px; }
.empty-sub { font-family: var(--mono); font-size: 11px; color: var(--mut); letter-spacing: 0.06em; text-transform: uppercase; }
.toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(6px); background: var(--ink); color: #fff; font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 9px 18px; border-radius: 8px; opacity: 0; pointer-events: none; transition: all 0.2s; z-index: 300; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<script src="nav.js"></script>
<script src="usage.js"></script>
<div class="page-head">
  <h1 data-i18n="nav.palettes">Palettes</h1>
  <div class="sub">the colour, weighted by age · scarcity you can read</div>
</div>
<div class="controls">
  <div class="controls-left">
    <div class="search-wrap"><input type="text" id="search" data-i18n-ph="palettes.search" placeholder="Search by name or tag…"></div>
    <select class="sort-select" id="sort">
      <option value="prob" data-i18n="sort.rarity">By Rarity</option>
      <option value="newest" data-i18n="sort.newest">Newest</option>
      <option value="oldest" data-i18n="sort.oldest">Oldest</option>
      <option value="name" data-i18n="sort.name">Name</option>
      <option value="colors" data-i18n="palettes.colors">Colors</option>
      <option value="usage" id="sortUsage" hidden>By Usage</option>
    </select>
    <span class="count" id="count"></span>
  </div>
  <div class="controls-right"></div>
</div>
<!-- Solo con sesión admin: el uso es dato interno, no relato público. -->
<div class="usage" id="usage" hidden>
  <div class="usage-head">
    <span class="usage-title">Usage</span>
    <span class="usage-sub" id="usageSub"></span>
    <button class="usage-copy" id="usageCopy">Copy data</button>
  </div>
  <div class="usage-grid" id="usageGrid"></div>
  <div class="usage-legend" id="usageLegend">
    <span>less</span>
    <i class="u0"></i><i class="u1"></i><i class="u2"></i><i class="u3"></i><i class="u4"></i>
    <span>more</span>
  </div>
</div>
<div class="grid" id="grid"></div>
<div class="toast" id="toast"></div>
<script>
const RAW = 'https://raw.githubusercontent.com/Joxemari/hoks/main/data/';

function ageWeight(createdMs) {
  if (!createdMs || createdMs < 1000) return 1.0;
  const ageDays = (Date.now() - createdMs) / 86400000;
  if (ageDays < 30)  return 4.0;
  if (ageDays < 90)  return 2.0;
  if (ageDays < 180) return 1.0;
  if (ageDays < 365) return 0.4;
  return 0.15;
}
const T = (k) => (window.HOKSI18N ? HOKSI18N.t(k) : k);
function probRarity(prob) {
  if (prob > 0.08)  return { label:T('rarity.common'),    cls:'common' };
  if (prob > 0.03)  return { label:T('rarity.uncommon'),  cls:'uncommon' };
  if (prob > 0.01)  return { label:T('rarity.rare'),       cls:'rare' };
  if (prob > 0.003) return { label:T('rarity.superrare'), cls:'superrare' };
  return                   { label:T('rarity.legendary'),  cls:'legendary' };
}
function formatDate(ms) {
  if (!ms || ms < 1000) return null;
  return new Date(ms).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
}

let pals = [], usage = { works: [] }, usageCounts = {};

// El uso solo se consulta desde dentro (admin / laboratorio). Para el público la
// página sigue siendo el catálogo de paletas y nada más: cuánto se ha usado cada
// una es material de trabajo, no relato.
const _isAdminSession = sessionStorage.getItem('hoks-admin-session') === '1' ||
                        localStorage.getItem('hoks-admin-session')   === '1';

Promise.all([
  fetch(RAW + 'palettes.json?t=' + Date.now()).then(r => r.ok ? r.json() : []),
  _isAdminSession ? HOKSUSAGE.load() : Promise.resolve({ works: [] }),
])
  .then(([data, u]) => {
    usage = u; usageCounts = HOKSUSAGE.counts(u);
    if (_isAdminSession) {
      document.getElementById('usage').hidden = false;
      document.getElementById('sortUsage').hidden = false;
    }
    // Compute probs on ALL palettes (active + inactive) for display
    const weights = data.map(p => ageWeight(p.created));
    const totalActive = data
      .filter(p => p.active !== false)
      .map(p => ageWeight(p.created))
      .reduce((a,b) => a+b, 0);
    pals = data.map((p,i) => ({
      ...p,
      prob: p.active !== false ? weights[i] / totalActive : 0
    }));
    render();
  })
  .catch(() => { document.getElementById('grid').innerHTML='<div class="empty-state"><p class="empty-big">'+T('palettes.loadError')+'</p></div>'; });

const uses = p => usageCounts[p.id] || 0;
function usesLabel(p) {
  const n = uses(p);
  if (!n)      return p.name + ' · unused';
  if (n === 1) return p.name + ' · 1 work';
  return p.name + ' · ' + n + ' works';
}

// Rejilla tipo registro: catálogo completo en orden de creación, tono por uso.
function renderUsage() {
  if (!_isAdminSession) return;
  const total = (usage.works || []).length;
  const used = Object.keys(usageCounts).length;
  document.getElementById('usageSub').textContent =
    total + ' saved works · ' + used + ' palettes used';
  const box = document.getElementById('usageGrid'), legend = document.getElementById('usageLegend');
  if (!total) {
    box.innerHTML = '<span class="usage-empty">No saved works yet</span>';
    legend.style.display = 'none';
    return;
  }
  legend.style.display = '';
  const list = pals.slice().sort((a,b) => (a.id||0)-(b.id||0));
  const max = list.reduce((m,p) => Math.max(m, uses(p)), 0);
  box.innerHTML = list.map(p => {
    const n = uses(p);
    const lvl = !n ? 0 : Math.min(4, Math.ceil(n / max * 4));
    return `<span class="ucell u${lvl}${p.active===false?' off':''}" data-pal="${esc(p.name)}" title="${esc(usesLabel(p))}"></span>`;
  }).join('');
}

// Volcado para trabajar fuera de la web (hoja de cálculo, notas, textos de
// escasez): una fila por paleta en orden de catálogo, con obras y cuota.
function usageTsv() {
  const total = (usage.works || []).length;
  const byPal = {};
  for (const w of (usage.works || [])) {
    if (w.paletteId == null) continue;
    (byPal[w.paletteId] = byPal[w.paletteId] || {})[w.family] =
      ((byPal[w.paletteId] || {})[w.family] || 0) + 1;
  }
  const pct = n => total ? (n / total * 100).toFixed(1) + '%' : '0%';
  const rows = [['id','paleta','activa','colores','prob','obras','cuota','familias'].join('\t')];
  for (const p of pals.slice().sort((a,b) => (a.id||0)-(b.id||0))) {
    const n = uses(p), fam = byPal[p.id] || {};
    rows.push([p.id, p.name, p.active === false ? 0 : 1, p.colors.join(' '),
               (p.prob * 100).toFixed(2) + '%', n, pct(n),
               Object.keys(fam).sort().map(k => k + '×' + fam[k]).join(' ')].join('\t'));
  }
  rows.push(['', 'TOTAL', '', '', '', total, pct(total), ''].join('\t'));
  return rows.join('\n');
}

function render() {
  renderUsage();
  const q = document.getElementById('search').value.toLowerCase().trim();
  const srt = document.getElementById('sort').value;
  let list = pals.filter(p => !q || p.name.toLowerCase().includes(q) || (p.tags||[]).some(t=>t.toLowerCase().includes(q)));
  if(srt==='prob')    list.sort((a,b) => a.prob - b.prob); // rarest first
  if(srt==='newest')  list.sort((a,b) => (b.created||0)-(a.created||0));
  if(srt==='oldest')  list.sort((a,b) => (a.created||0)-(b.created||0));
  if(srt==='name')    list.sort((a,b) => a.name.localeCompare(b.name));
  if(srt==='colors')  list.sort((a,b) => b.colors.length-a.colors.length);
  if(srt==='usage')   list.sort((a,b) => uses(b)-uses(a));
  // Las paletas retiradas siempre al final: van en gris, y abrir con ellas
  // (prob 0 se colaba como "la más rara") dejaba la página lavada. Sort estable:
  // conserva el orden elegido dentro de cada grupo.
  list.sort((a,b) => (a.active===false?1:0) - (b.active===false?1:0));
  const active = list.filter(p => p.active !== false).length;
  document.getElementById('count').textContent = T('palettes.count').replace('%1', list.length).replace('%2', active);
  const grid = document.getElementById('grid');
  if (!list.length) { grid.innerHTML='<div class="empty-state"><p class="empty-big">'+T('palettes.noResults')+'</p><p class="empty-sub">'+T('palettes.tryDifferent')+'</p></div>'; return; }
  const isActive = p => p.active !== false;
  grid.innerHTML = list.map(p => {
    const active = isActive(p);
    const rarity = active ? probRarity(p.prob) : null;
    const dateStr = formatDate(p.created);
    const probPct = active ? (p.prob * 100).toFixed(1) + '%' : null;
    return `
    <div class="palette-card${active?'':' inactive'}">
      <div class="swatches">
        ${p.colors.map(c=>`<div class="swatch" style="background:${esc(c)}" data-hex="${esc(c)}"><span class="swatch-tip">${esc(c)}</span></div>`).join('')}
      </div>
      <div class="card-body">
        <div class="card-name-row">
          <div class="card-name">${esc(p.name)}</div>
          ${active && rarity ? `<span class="prob-badge prob-${rarity.cls}">${rarity.label}</span>` : `<span class="inactive-tag">${T('palettes.inactive')}</span>`}
        </div>
        <div class="card-meta">
          ${dateStr ? `<span class="card-date">${dateStr}</span>` : ''}
          ${active && probPct ? `<span class="card-date" style="color:#888;">↑ ${probPct} ${T('palettes.chance')}</span>` : ''}
          ${uses(p) ? `<span class="usage-chip" title="${esc(usesLabel(p))}">×${uses(p)}</span>` : ''}
        </div>
        ${p.tags?.length ? `<div class="card-tags">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
      </div>
      <div class="card-footer">
        <div class="hex-list">${p.colors.map(c=>`<span class="hex-chip" data-hex="${esc(c)}">${esc(c)}</span>`).join('')}</div>
        <div class="card-actions">
          <button class="btn-icon" title="${T('palettes.copyAll')}" data-copyall="${p.id}">⎘</button>
        </div>
      </div>
    </div>`}).join('');
}

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast(T('palettes.copied')+t); }
  catch(e) { toast(T('toast.copyFailed')); }
}
function copySwatch(hex,el) { copyText(hex); const tip=el.querySelector('.swatch-tip'); if(tip){tip.textContent='✓';setTimeout(()=>{tip.textContent=hex;},1200);} }

document.getElementById('search').addEventListener('input',render);
document.getElementById('sort').addEventListener('change',render);
window.addEventListener('hoks:langchange', () => { if (pals.length) render(); });
const usageCopyBtn = document.getElementById('usageCopy');
if (usageCopyBtn) usageCopyBtn.addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(usageTsv()); toast('Usage data copied'); }
  catch (e) { toast(T('toast.copyFailed')); }
});
document.addEventListener('click',e=>{
  const cell=e.target.closest('.ucell[data-pal]');
  if(cell){const s=document.getElementById('search');s.value=cell.dataset.pal;render();document.getElementById('grid').scrollIntoView({behavior:'smooth',block:'start'});return;}
  const swatch=e.target.closest('.swatch[data-hex]'); if(swatch){copySwatch(swatch.dataset.hex,swatch);return;}
  const chip=e.target.closest('.hex-chip[data-hex]'); if(chip){copyText(chip.dataset.hex);return;}
  const ca=e.target.closest('[data-copyall]'); if(ca){const p=pals.find(x=>x.id==ca.dataset.copyall);if(p)copyText(p.colors.join(', '));return;}
});

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}
</script>
</body>
</html>
